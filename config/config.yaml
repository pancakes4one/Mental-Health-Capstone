data:
  raw_path: "data/raw/survey.csv"
  processed_path: "data/processed/survey_clean.csv"
  target_column: "treatment"
  test_size: 0.2
  random_state: 42

preprocessing:
  drop_columns:
    - "Timestamp"
    - "comments"          # mostly missing, free text, not usable
    - "state"              # mostly missing, only applies to US respondents
  age_valid_range: [13, 100]   # raw data has garbage values (-1726, 99999999999)
  is_us_flag: true              # Country collapsed to a binary is_us flag (high cardinality otherwise)
  gender_categories: ["female", "male", "other"]   # normalized from free text
  unsure_values: ["Don't know", "Not sure", "Maybe"]   # standardized to "Unsure"
  work_interfere_missing_fill: "Not applicable"   # missing = no condition to interfere with

models:
  random_forest_default:
    n_estimators: 100
    max_depth: 10
    random_state: 42
    class_weight: "balanced"

  random_forest_deeper:
    n_estimators: 200
    max_depth: 20
    random_state: 42
    class_weight: "balanced"

  gradient_boosting_default:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    random_state: 42

  gradient_boosting_slow_lr:
    n_estimators: 200
    max_depth: 3
    learning_rate: 0.05
    random_state: 42

  neural_network:
    hidden_layer_sizes: [64, 32]
    activation: "relu"
    solver: "adam"
    max_iter: 500
    random_state: 42
    early_stopping: true
    validation_fraction: 0.1

mlflow:
  experiment_name: "MentalHealth_Capstone"
  tracking_uri: "mlruns"

llm:
  provider: "nebius"
  base_url: "https://api.tokenfactory.nebius.com/v1/"
  model: "meta-llama/Llama-3.3-70B-Instruct"